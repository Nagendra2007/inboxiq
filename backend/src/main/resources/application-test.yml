spring:
  datasource:
    url: jdbc:h2:mem:mailroom;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  session:
    jdbc:
      # Flyway (which creates these tables in production) is off in tests.
      initialize-schema: always
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

app:
  gmail:
    # Scheduled background checks would race with tests that drive sync by hand.
    background-poll-minutes: 0
  security:
    # Test-only key: Base64 of the 32 ASCII bytes "mailroom-test-key-not-for-prod32".
    token-encryption-key: bWFpbHJvb20tdGVzdC1rZXktbm90LWZvci1wcm9kMzI=
  ai:
    api-key: test-key
    model: test/model
