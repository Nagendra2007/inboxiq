name: Keep warm

# Render's free instance spins down after ~15 minutes without inbound
# traffic, and the next visitor then pays for a full container + JVM start —
# measured at 216 seconds on 2026-09-27. Nothing inside a sleeping instance
# can wake it, so the ping has to come from outside. It also gives
# SyncCoordinator's background beat an instance to run in, which is the only
# way mail can sync while nobody is signed in.
#
# This is a public repository, so these minutes are free. Two caveats:
# GitHub delays scheduled runs under load, which is why one run pings for
# eight minutes rather than once — a late run still lands inside the
# 15-minute window. And GitHub disables schedules in a repository with no
# activity for 60 days (it emails first).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping health every two minutes
        env:
          # Set the APP_URL repository variable to point this somewhere else.
          APP_URL: ${{ vars.APP_URL || 'https://inboxiq-g72a.onrender.com' }}
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            start=$SECONDS
            # Generous timeout: if it did spin down, this request is the
            # cold start and waiting through it is the whole point.
            code=$(curl -sS -o /dev/null -w "%{http_code}" -m 300 "$APP_URL/actuator/health") || code=000
            echo "ping $i -> $code in $((SECONDS - start))s"
            if [ "$code" = 200 ]; then ok=$((ok + 1)); fi
            [ "$i" = 5 ] || sleep 120
          done
          # One failed ping is noise; five in a row means it is really down,
          # and a failed run is worth an email.
          if [ "$ok" -eq 0 ]; then
            echo "::error::$APP_URL never answered in this run"
            exit 1
          fi
          echo "$ok/5 pings answered"
